[package]
name = "compio-buf"
version = "0.8.3"
description = "Buffer trait for completion based async IO"
categories = ["asynchronous"]
keywords = ["async"]
readme = "README.md"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bumpalo = { version = "3.14.0", optional = true }
arrayvec = { version = "0.7.4", optional = true }
bytes = { workspace = true, optional = true, default-features = false }
smallvec = { workspace = true, optional = true }
memmap2 = { version = "0.9.9", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = ["std"]
## `std`: the `std::io` adapter types and `std::fs::File`-family impls. Off
## for no_std, where `bytes`-family impls still apply.
std = ["bytes?/std"]
## `core::io` error types on no_std: nightly-only until `core_io_fundamentals`
## stabilizes (rust-lang/rust#154046).
core-io = []
# Dependencies
arrayvec = ["dep:arrayvec"]
smallvec = ["dep:smallvec"]
bumpalo = ["dep:bumpalo"]
bytes = ["dep:bytes"]
memmap2 = ["std", "dep:memmap2"]

# Nightly features
allocator_api = []
read_buf = []
try_trait_v2 = []
nightly = ["allocator_api", "read_buf", "try_trait_v2"]
